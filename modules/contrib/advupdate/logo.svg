<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Advanced Update Report module icon</title>
  <desc id="desc">An envelope with an update arrow and security shield, representing Drupal update report emails and security alerts.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E7CC3"/>
      <stop offset="100%" stop-color="#0A5E93"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF4FB"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#37B26C"/>
      <stop offset="100%" stop-color="#238A50"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#083B5C" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="88" y="122" width="336" height="220" rx="28" fill="url(#card)"/>
    <path d="M110 154 L256 258 L402 154" fill="none" stroke="#0E7CC3" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M112 312 L208 228" fill="none" stroke="#BCD9EC" stroke-width="16" stroke-linecap="round"/>
    <path d="M400 312 L304 228" fill="none" stroke="#BCD9EC" stroke-width="16" stroke-linecap="round"/>
  </g>

  <g>
    <circle cx="346" cy="178" r="54" fill="#E6F3FB"/>
    <path d="M346 146
             a32 32 0 1 1 -22.6 9.4" 
          fill="none" stroke="#F05A28" stroke-width="16" stroke-linecap="round"/>
    <path d="M310 150 L324 154 L320 168" fill="none" stroke="#F05A28" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M256 282
             C287 302 323 311 323 311
             V360
             C323 409 286 442 256 456
             C226 442 189 409 189 360
             V311
             C189 311 225 302 256 282 Z"
          fill="url(#shield)"/>
    <path d="M225 370 L247 392 L290 343" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
